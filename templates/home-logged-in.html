<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/home.css">
    <title>BOTC Tracker - Home</title>
</head>


<body>
    <div class="nav">
        <h1 class="nav-title">BOTC Tracker</h1>
        <div class="profile-container">
            <img src="{{ user.picture }}" class="profile-image">
            <p class="profile-name">{{user.name}}</p>
            <a class="profile-logout" href="/logout">Logout</a>
        </div>
    </div>
    <h2>My recent Games</h2>
    <a class="create-new-game" href="/create-game"><button>Create New Game</button></a>
    <div class="games">
        {% for game in games %}
        <a href="/game/{{game.ID}}">{{game.Name}}</a>
        <p>{{game.Script.Name}}</p>
        <p>{{game.Creationdate}}</P>
        {% endfor %}
    </div>
</body>

</html>
